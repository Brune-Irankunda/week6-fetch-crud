
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CRUD Posts Manager</title>
</head>

<body class="bg-gray-100 min-h-screen">

  <header class="bg-blue-700 text-white p-6">
    <div class="max-w-6xl mx-auto">
      <h1 class="text-3xl font-bold">CRUD Posts Manager</h1>
      <p class="mt-2">Manage your posts easily</p>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6">

    <p id="status-message" class="mb-6 text-gray-600">
      Loading posts...
    </p>

    <section>
      <h2 class="text-2xl font-bold mb-6">All Posts</h2>

      <div
        id="posts-container"
        class="grid grid-cols-1 md:grid-cols-2 gap-6"
      ></div>
    </section>

  </main>

  <script type="module" src="/src/main.js"></script>

</body>
</html>
